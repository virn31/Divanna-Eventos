<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0b10">
<title>DiMa Equipo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0b10; --ink-2:#151319; --ink-3:#1d1b23;
    --paper:#f6f1ea;
    --divanna:#b98bff; --maiz:#f0b93a;
    --line: rgba(246,241,234,0.14);
    --muted: rgba(246,241,234,0.6);
    --good:#7fd88f; --warn:#f0b93a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink); color:var(--paper);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-top:var(--safe-top);
    padding-bottom:var(--safe-bottom);
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:700;margin:0;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
    padding:32px 24px; gap:28px;
    background:
      radial-gradient(ellipse 700px 500px at 20% 0%, rgba(185,139,255,0.16), transparent 60%),
      radial-gradient(ellipse 600px 400px at 100% 100%, rgba(240,185,58,0.12), transparent 55%);
  }
  .login-brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:1.3rem;justify-content:center;}
  .login-brand .dv{color:var(--divanna);} .login-brand .vm{color:var(--maiz);}
  .login-card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:22px;
    padding:32px 26px;
  }
  .login-card h1{font-size:1.6rem;margin-bottom:8px;}
  .login-card p{color:var(--muted);font-size:0.95rem;margin:0 0 26px;line-height:1.5;}
  .code-input{
    width:100%; padding:18px 20px; border-radius:14px;
    border:1.5px solid var(--line); background:var(--ink);
    color:var(--paper); font-size:1.15rem; font-weight:700;
    letter-spacing:0.06em; text-align:center; text-transform:uppercase;
    outline:none;
  }
  .code-input:focus{border-color:var(--divanna);}
  .login-btn{
    width:100%; margin-top:16px; padding:17px; border:none; border-radius:14px;
    background:var(--maiz); color:var(--ink); font-weight:800; font-size:1.02rem;
    cursor:pointer; transition:transform .15s;
  }
  .login-btn:active{transform:scale(0.98);}
  .login-btn:disabled{opacity:0.55;}
  .code-input.usuario{text-transform:none; letter-spacing:0.02em;}
  .code-input + .code-input{margin-top:12px;}
  /* El asistente solo marca la carga y lanza alertas: se ocultan los controles del líder. */
  body.rol-asistente .estatus-select,
  body.rol-asistente .alert-btn.retraso,
  body.rol-asistente .checklist,
  body.rol-asistente .progress-bar{display:none;}
  body.rol-asistente .alert-actions{grid-template-columns:1fr 1fr;}
  .login-error{
    color:#ff8a8a; font-size:0.88rem; margin-top:14px; text-align:center; min-height:18px;
  }
  .login-hint{text-align:center; color:var(--muted); font-size:0.8rem; margin-top:18px;}

  /* ---------- APP SHELL ---------- */
  #appScreen{display:none; min-height:100vh; flex-direction:column;}
  header.appbar{
    position:sticky; top:0; z-index:20;
    background:rgba(12,11,16,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:18px 20px calc(18px + var(--safe-top)) 20px;
    padding-top:calc(18px + var(--safe-top));
    display:flex; align-items:center; justify-content:space-between;
  }
  .appbar-info h2{font-size:1.15rem;}
  .appbar-info span{color:var(--muted); font-size:0.82rem;}
  .icon-btn{
    background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
    width:40px; height:40px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; cursor:pointer; font-size:1.1rem;
  }

  main{flex:1; padding:20px 18px 100px; max-width:640px; margin:0 auto; width:100%;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
  }
  .empty-state .big{font-size:2.6rem; margin-bottom:14px;}

  .day-label{
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); margin:22px 0 10px; padding-left:4px;
  }
  .day-label:first-child{margin-top:4px;}

  .event-card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:18px;
    padding:20px; margin-bottom:14px;
  }
  .event-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px;}
  .event-badge{
    display:inline-block; font-size:0.72rem; font-weight:800; letter-spacing:0.03em;
    padding:5px 11px; border-radius:100px; text-transform:uppercase;
  }
  .badge-divanna{background:rgba(185,139,255,0.16); color:var(--divanna);}
  .badge-vasomaiz{background:rgba(240,185,58,0.16); color:var(--maiz);}
  .event-folio{font-size:0.78rem; color:var(--muted); font-family:monospace;}
  .event-card h3{font-size:1.2rem; margin:10px 0 2px;}
  .event-meta{display:flex; flex-wrap:wrap; gap:14px; margin:12px 0 16px; font-size:0.88rem; color:var(--muted);}
  .event-meta span{display:flex; align-items:center; gap:6px;}
  .event-services{
    font-size:0.9rem; color:var(--paper); background:var(--ink);
    border-radius:10px; padding:10px 12px; margin-bottom:16px; line-height:1.4;
  }

  .checklist{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .check-item{
    display:flex; align-items:center; gap:9px;
    background:var(--ink); border:1.5px solid var(--line); border-radius:12px;
    padding:12px 10px; cursor:pointer; transition:border-color .15s, background .15s;
    font-size:0.85rem; font-weight:600; user-select:none;
  }
  .check-item .box{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line);
    flex:none; display:flex; align-items:center; justify-content:center; font-size:0.8rem;
    transition:background .15s, border-color .15s;
  }
  .check-item.done{border-color:var(--good); background:rgba(127,216,143,0.08);}
  .check-item.done .box{background:var(--good); border-color:var(--good); color:var(--ink);}

  .progress-bar{
    height:5px; border-radius:100px; background:var(--ink); overflow:hidden; margin-top:14px;
  }
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--divanna),var(--maiz)); border-radius:100px; transition:width .3s;}

  /* ---------- ESTATUS LOGÍSTICO + PAGO ---------- */
  .estatus-row{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .estatus-select{
    flex:1; min-width:180px; padding:12px 14px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--ink); color:var(--paper);
    font-size:0.88rem; font-weight:700; outline:none;
  }
  .estatus-select:focus{border-color:var(--divanna);}
  .pago-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:700;
    padding:8px 12px; border-radius:100px; background:var(--ink); border:1.5px solid var(--line);
  }
  .pago-badge.pendiente{color:var(--warn); border-color:var(--warn);}
  .pago-badge.pagado{color:var(--good); border-color:var(--good);}
  .alert-actions{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px;}
  .alert-btn{
    border:1.5px solid var(--line); background:var(--ink); color:var(--paper);
    border-radius:12px; padding:11px 6px; font-size:0.76rem; font-weight:700;
    cursor:pointer; text-align:center; line-height:1.3;
  }
  .alert-btn.retraso{border-color:var(--warn); color:var(--warn);}
  .alert-btn.emergencia{border-color:#ff6b6b; color:#ff6b6b;}
  .alert-btn.seguridad{border-color:#ff9f4a; color:#ff9f4a;}
  .alert-btn.active{background:currentColor;}
  .alert-btn.active.retraso{color:var(--ink); background:var(--warn);}
  .alert-btn.active.emergencia{color:var(--ink); background:#ff6b6b;}
  .alert-btn.active.seguridad{color:var(--ink); background:#ff9f4a;}
  .enterado-btn{
    width:100%; margin-top:12px; padding:12px; border-radius:12px; border:1.5px solid var(--good);
    background:var(--good); color:var(--ink); font:inherit; font-weight:800; cursor:pointer;
  }
  .enterado-ok{margin-top:12px; font-size:0.82rem; font-weight:700; color:var(--good);}
  .motivo-tag{
    font-size:0.8rem; color:var(--muted); margin-top:8px; padding:8px 10px;
    background:var(--ink); border-radius:10px; border:1px solid var(--line);
  }

  /* ---------- GERENTE: asignar eventos de El Vaso Maíz ---------- */
  .asignar-box{margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--ink); border:1.5px solid var(--line); font-size:0.85rem;}
  .asignar-box summary{cursor:pointer; font-weight:800; color:var(--maiz);}
  .asignar-box select{width:100%; margin-top:8px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--ink-2); color:var(--paper); font:inherit;}
  .asignar-box label{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .asignar-box .asig-guardar{width:100%; margin-top:10px; padding:11px; border-radius:10px; border:none; background:var(--maiz); color:var(--ink); font:inherit; font-weight:800; cursor:pointer;}
  .asignar-box .asig-msg{margin-top:8px; color:var(--muted); font-size:0.8rem;}

  /* ---------- CANAL CON DiMa (gerente) ---------- */
  .dima-fab{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); left:20px; z-index:40;
    padding:0 18px; height:54px; border-radius:27px; border:none; background:var(--divanna); color:var(--ink);
    font:inherit; font-weight:800; box-shadow:0 10px 30px -8px rgba(0,0,0,0.6); cursor:pointer;
  }
  .dima-fab[hidden], .dima-panel[hidden]{display:none;}
  .dima-panel{
    position:fixed; inset:auto 0 0 0; z-index:50; max-height:80vh; display:flex; flex-direction:column;
    background:var(--ink-2); border-top:1.5px solid var(--divanna); border-radius:18px 18px 0 0;
    padding:14px 14px calc(14px + var(--safe-bottom));
  }
  .dima-top{display:flex; align-items:center; justify-content:space-between; font-weight:800; margin-bottom:8px;}
  .dima-top button{border:none; background:transparent; color:var(--muted); font:inherit; cursor:pointer;}
  .dima-msgs{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-height:120px;}
  .dima-msg{max-width:85%; padding:10px 12px; border-radius:14px; font-size:0.9rem; line-height:1.45; white-space:pre-wrap;}
  .dima-msg.yo{align-self:flex-end; background:var(--maiz); color:var(--ink);}
  .dima-msg.dima{align-self:flex-start; background:var(--ink); border:1px solid var(--line);}
  .dima-form{display:flex; gap:8px; margin-top:10px;}
  .dima-form textarea{flex:1; resize:none; height:46px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--ink); color:var(--paper); font:inherit;}
  .dima-form button{border:none; border-radius:12px; padding:0 16px; background:var(--divanna); color:var(--ink); font:inherit; font-weight:800; cursor:pointer;}

  /* ---------- INSTRUCCIONES DE DIANA / DEL CLIENTE ---------- */
  .instr-box{
    margin:12px 0; padding:12px 14px; border-radius:12px; font-size:0.88rem; line-height:1.45; white-space:pre-wrap;
    background:rgba(185,139,255,0.1); border:1.5px solid var(--divanna);
  }
  .instr-box b{display:block; margin-bottom:4px; color:var(--divanna);}

  /* ---------- VISTA EQUIPO (solo Admin): ver la app como cada colaborador ---------- */
  .vista-admin{
    margin:14px 18px 0; padding:12px 14px; border-radius:14px; background:var(--ink-2);
    border:1.5px solid var(--divanna); display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:0.85rem;
  }
  .vista-admin[hidden]{display:none;}
  .vista-admin select{
    flex:1; min-width:180px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--ink); color:var(--paper); font:inherit; font-weight:700;
  }
  .vista-admin label{display:flex; align-items:center; gap:6px; color:var(--muted);}
  .vista-admin a{color:var(--divanna); font-weight:800; text-decoration:none;}

  /* ---------- ACTIVAR ALERTAS PUSH ---------- */
  .alertas-banner{
    margin:14px 18px 0; padding:12px 14px; border-radius:14px; font-size:0.85rem; line-height:1.4;
    background:rgba(240,185,58,0.12); border:1.5px solid var(--warn); display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .alertas-banner[hidden]{display:none;}
  .alertas-banner span{flex:1; min-width:180px;}
  .alertas-banner button{border:none; border-radius:10px; padding:10px 14px; background:var(--maiz); color:var(--ink); font-weight:800; cursor:pointer;}

  /* ---------- ALERTAS DE OTRAS BRIGADAS (antes llegaban por WhatsApp) ---------- */
  .alerta-equipo{
    margin-bottom:14px; padding:14px 16px; border-radius:14px;
    border:1.5px solid #ff6b6b; background:rgba(255,107,107,0.1); font-size:0.88rem; line-height:1.45;
  }
  .alerta-equipo.seguridad{border-color:#ff9f4a; background:rgba(255,159,74,0.1);}
  .alerta-equipo b{display:block; margin-bottom:2px;}
  .link-mapa{color:var(--paper); font-weight:800;}

  /* ---------- CHECKLIST DE CARGA (por items de la cotización) ---------- */
  .carga-box{margin:14px 0; padding:14px 16px; background:var(--ink); border-radius:14px; border:1px solid var(--line);}
  .carga-title{font-size:0.82rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:8px;}
  .carga-item{
    display:flex; align-items:center; gap:10px; padding:9px 4px; font-size:0.9rem; cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .carga-item:last-child{border-bottom:none;}
  .carga-item .box{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:0.85rem;
  }
  .carga-item.marcado .box{background:var(--e-cerrado, #39e991); border-color:var(--e-cerrado, #39e991); color:var(--ink);}
  .carga-item.marcado span.texto{color:var(--muted); text-decoration:line-through;}
  .carga-warning{font-size:0.78rem; color:var(--warn); margin-top:6px;}

  .refresh-fab{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); right:20px;
    width:54px; height:54px; border-radius:50%; border:none;
    background:var(--maiz); color:var(--ink); font-size:1.3rem;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 30px -8px rgba(0,0,0,0.6); cursor:pointer;
  }
  .refresh-fab.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; bottom:calc(90px + var(--safe-bottom)); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink-3); border:1px solid var(--line); color:var(--paper);
    padding:12px 20px; border-radius:100px; font-size:0.85rem; font-weight:600;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loader{
    display:flex; align-items:center; justify-content:center; padding:60px 0; color:var(--muted); gap:10px;
  }
  .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--maiz); animation:spin 0.7s linear infinite;}

  @media (prefers-reduced-motion:reduce){
    .spinner, .refresh-fab.spinning svg{animation:none;}
  }
</style>
</head>
<body>

<!-- ---------- LOGIN ---------- -->
<div id="loginScreen">
  <div class="login-brand"><span class="dv">divanna</span>&nbsp;×&nbsp;<span class="vm">vaso maíz</span></div>
  <div class="login-card">
    <h1>DiMa Equipo</h1>
    <p>Entra con tu usuario y tu PIN para ver tus eventos y lo que te toca hoy.</p>
    <input type="text" id="usuarioInput" class="code-input usuario" placeholder="Usuario" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30">
    <input type="password" id="pinInput" class="code-input" placeholder="PIN de 6 dígitos" autocomplete="current-password" inputmode="numeric" pattern="[0-9]*" maxlength="6">
    <button id="loginBtn" class="login-btn">Entrar</button>
    <div id="loginError" class="login-error"></div>
  </div>
  <div class="login-hint">¿No tienes usuario o PIN? Pídeselo a Diana o a Víctor.</div>
</div>

<!-- ---------- APP ---------- -->
<div id="appScreen">
  <header class="appbar">
    <div class="appbar-info">
      <h2 id="brigadaNombre">Brigada</h2>
      <span id="brigadaDetalle">—</span>
    </div>
    <button class="icon-btn" id="logoutBtn" aria-label="Cerrar sesión">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>
  <div id="vistaAdmin" class="vista-admin" hidden>
    <select id="vistaComo" aria-label="Ver la app como">
      <option value="">Todos los eventos</option>
    </select>
    <label><input type="checkbox" id="vistaAsistente"> Como asistente</label>
    <a href="dashboard.html">← Dashboard</a>
  </div>
  <div id="alertasBanner" class="alertas-banner" hidden></div>
  <main id="mainContent">
    <div class="loader"><div class="spinner"></div> Cargando eventos…</div>
  </main>
  <button class="refresh-fab" id="refreshBtn" aria-label="Actualizar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>
  <button class="dima-fab" id="dimaFab" hidden>💬 Pregúntale a DiMa</button>
  <div class="dima-panel" id="dimaPanel" hidden>
    <div class="dima-top"><span>💬 DiMa, tu asistente</span><span><button id="dimaNueva">Nueva plática</button><button id="dimaCerrar">✕</button></span></div>
    <div class="dima-msgs" id="dimaMsgs"></div>
    <form class="dima-form" id="dimaForm"><textarea id="dimaTexto" maxlength="1500" placeholder="Pregúntale lo que sea de la plataforma o de tus eventos"></textarea><button type="submit">Enviar</button></form>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="alertas.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // Sesión compartida con dashboard.html (mismo origen): { token, nombre, rol }.
  const SESION_KEY = 'dima_sesion';

  const loginScreen = $('loginScreen');
  const appScreen = $('appScreen');
  const usuarioInput = $('usuarioInput');
  const pinInput = $('pinInput');
  const loginBtn = $('loginBtn');
  const loginError = $('loginError');
  const mainContent = $('mainContent');
  const refreshBtn = $('refreshBtn');
  const toast = $('toast');

  function leerSesion(){
    try { return JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); } catch(e){ return null; }
  }
  function guardarSesion(sesion){
    try { localStorage.setItem(SESION_KEY, JSON.stringify(sesion)); } catch(e){}
  }
  let sesion = leerSesion();

  // fetch con el token de sesión; si expiró, regresa al login.
  async function api(url, opciones = {}){
    const res = await fetch(url, {
      ...opciones,
      headers: { ...(opciones.headers || {}), Authorization: `Bearer ${sesion ? sesion.token : ''}` },
    });
    const data = await res.json().catch(() => ({}));
    if(res.status === 401){
      cerrarSesion(data.error || 'Tu sesión expiró, vuelve a entrar.');
      throw new Error('sesion');
    }
    if(!res.ok) throw new Error(data.error || 'fail');
    return data;
  }

  // Brigadas y encargadas para la gerente de El Vaso Maíz (null para los demás).
  let opcionesAsignar = null;

  function bloqueAsignar(ev){
    if(!opcionesAsignar || !ev.vasoMaiz) return '';
    return `
      <details class="asignar-box" data-caja="asig-${esc(ev.id)}">
        <summary>👷 Asignar brigada y encargada</summary>
        <select class="asig-brigada">
          <option value="">Sin brigada</option>
          ${opcionesAsignar.brigadas.map(b => `<option value="${esc(b.id)}" ${b.id === ev.brigadaId ? 'selected' : ''}>${esc(b.nombre)}</option>`).join('')}
        </select>
        ${opcionesAsignar.encargadas.map(c => `<label><input type="checkbox" class="asig-encargada" value="${esc(c.id)}" ${(ev.encargadaIds || []).includes(c.id) ? 'checked' : ''}> ${esc(c.nombre)}</label>`).join('')}
        ${opcionesAsignar.produccion ? `
          <div style="margin-top:10px; font-weight:800;">🍳 Encargado de producción</div>
          <select class="asig-produccion">
            <option value="">Sin encargado de producción</option>
            ${opcionesAsignar.produccion.map(p => `<option value="${esc(p.id)}" ${p.id === ev.produccionId ? 'selected' : ''}>${esc(p.nombre)}${p.conTelegram ? '' : ' (📵 sin Telegram)'}</option>`).join('')}
          </select>
          <div class="asig-msg">Le llega por Telegram la lista de producción dos días antes y el mismo día.</div>`
          : `<div class="asig-msg">🍳 No se pudo leer quién puede hacer producción. Toca actualizar.</div>`}
        <button class="asig-guardar" data-evento="${esc(ev.id)}">Guardar y avisar</button>
        <div class="asig-msg asig-resultado"></div>
      </details>`;
  }

  // Staff de El Vaso Maíz por evento (solo la gerente): lo mismo que /staff en Telegram.
  let staffEventos = null;
  let staffError = false;
  const STAFF_ESTADO = {
    confirmo: '✅ confirmó',
    invitada: '⏳ invitada, esperando respuesta',
    no_puede: '❌ dijo que no podía',
    sin_telegram: '📵 no ha activado sus mensajes (pide su enlace en /staff)',
    choque: '⛔ ya tiene otro evento a esa hora',
  };

  function bloqueStaff(ev){
    if(!opcionesAsignar || !ev.vasoMaiz) return '';
    if(staffError) return `<div class="asignar-box">🧑‍🍳 Staff: no se pudo leer la lista. Toca actualizar o usa /staff en Telegram.</div>`;
    const s = staffEventos && staffEventos[ev.id];
    if(!s) return '';
    const confirmadas = s.chicas.filter(c => c.estado === 'confirmo').length;
    const lista = s.chicas.length
      ? s.chicas.map(c => {
          const invitable = c.estado === 'libre' || c.estado === 'no_puede';
          const nota = c.estado === 'choque' ? `${STAFF_ESTADO.choque} (${esc(c.choqueFolio)})` : (STAFF_ESTADO[c.estado] || '');
          return `<label><input type="checkbox" class="staff-chica" value="${esc(c.id)}" ${invitable ? '' : 'disabled'}> ${esc(c.nombre)}${nota ? ` <span class="asig-msg">${nota}</span>` : ''}</label>`;
        }).join('')
      : '<div class="asig-msg">Aún no tienes personal agregado: usa "➕ Agregar personal" en /staff de Telegram.</div>';
    return `
      <details class="asignar-box" data-caja="staff-${esc(ev.id)}">
        <summary>🧑‍🍳 Staff · ${confirmadas} de ${s.necesita || '?'} confirmadas</summary>
        ${lista}
        ${s.chicas.length ? `<button class="asig-guardar staff-invitar" data-evento="${esc(ev.id)}">📨 Invitar por Telegram</button>` : ''}
        <div class="asig-msg staff-msg"></div>
      </details>`;
  }

  // Cambio que pidió el cliente. Confirmado por la gerencia: lo ve todo el
  // equipo. Pendiente: solo la gerente (el equipo se entera al confirmarse).
  function avisoCambio(ev){
    const c = ev.cambio;
    if(!c) return '';
    const cuando = (iso) => iso ? new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    const antes = c.antes ? `<details><summary>Ver cómo estaba antes</summary>${esc(c.antes)}</details>` : '';
    if(c.estado === 'confirmado'){
      return `<div class="instr-box"><b>🔄 El pedido cambió (${cuando(c.confirmadoEl)})</b>El cliente pidió un cambio y la gerencia lo confirmó. Lo que hay que llevar ya está actualizado abajo.${antes}</div>`;
    }
    if(c.estado === 'pendiente' && opcionesAsignar){
      return `<div class="instr-box"><b>${c.urgente ? '⚠️ URGENTE · ' : ''}✏️ El cliente pidió un cambio (${cuando(c.pedidoEl)})</b>Pendiente de que Diana lo confirme; el equipo todavía no lo sabe.<br><br>${esc(c.servicios)}${antes}</div>`;
    }
    return '';
  }

  // Quién tiene la producción del evento y su última respuesta (solo la gerente).
  function lineaProduccion(ev){
    if(!opcionesAsignar || !ev.vasoMaiz || !ev.produccionId) return '';
    const p = (opcionesAsignar.produccion || []).find(x => x.id === ev.produccionId);
    return `<div class="instr-box"><b>🍳 Producción: ${esc(p ? p.nombre : 'asignada')}</b>${esc(ev.produccionRespuesta || 'Todavía no responde.')}</div>`;
  }

  async function invitarStaff(btn){
    const caja = btn.closest('.asignar-box');
    const msg = caja.querySelector('.staff-msg');
    const ids = [...caja.querySelectorAll('.staff-chica:checked')].map(c => c.value);
    if(!ids.length){ msg.textContent = 'Marca a quién quieres invitar.'; return; }
    btn.disabled = true;
    msg.textContent = 'Enviando…';
    try {
      const d = await api('/api/dashboard-eventos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventoId: btn.dataset.evento, accion: 'invitar_staff', colaboradorIds: ids }),
      });
      msg.textContent = (d.enviadas.length ? `📨 Invitación enviada a ${d.enviadas.join(', ')}. Te avisa Telegram cuando respondan.` : 'No se envió ninguna invitación nueva.')
        + (d.fallidas.length ? ` ⚠️ No les llegó a: ${d.fallidas.join(', ')}. Avísales por otro medio.` : '');
      // Se repinta para ver los ⏳; si a alguien no le llegó, el aviso se queda a la vista.
      if(!d.fallidas.length){ ultimaFoto = null; setTimeout(() => loadEventos(true), 4000); }
    } catch(e){
      if(e.message === 'sesion') return;
      msg.textContent = e.message && e.message !== 'fail' ? e.message : 'No se pudo enviar, intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  }

  async function guardarAsignacion(btn){
    const caja = btn.closest('.asignar-box');
    const msg = caja.querySelector('.asig-resultado');
    btn.disabled = true;
    msg.textContent = 'Guardando…';
    try {
      const d = await api('/api/dashboard-eventos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          eventoId: btn.dataset.evento,
          accion: 'asignar',
          brigadaId: caja.querySelector('.asig-brigada').value,
          encargadaIds: [...caja.querySelectorAll('.asig-encargada:checked')].map(c => c.value),
          // Si no se pudo leer la lista, no se manda (el servidor no toca al encargado actual).
          ...(caja.querySelector('.asig-produccion') ? { produccionId: caja.querySelector('.asig-produccion').value } : {}),
        }),
      });
      const p = d.produccion;
      const textoProduccion = !p ? ''
        : (p.enviados.length ? ` 🍳 Producción avisada: ${p.enviados.join(', ')}.` : '')
          + (p.fallidos.length ? ` ⚠️ No le llegó el aviso de producción a ${p.fallidos.map(x => x.nombre + ' (' + x.motivo + ')').join(', ')}.` : '');
      msg.textContent = !d.avisados ? 'Guardado. No hay nadie nuevo a quien avisar.'
        : `Guardado. Avisos a ${d.avisados}: Telegram ${d.porTelegram} de ${d.conTelegram} vinculados, app ${d.porPush}.`
          + ((d.sinTelegram || []).length ? ` Sin Telegram: ${d.sinTelegram.join(', ')}.` : '')
          + ((d.erroresAvisos || []).length ? ` ⚠️ ${d.erroresAvisos.join(' · ')}` : '');
      msg.textContent += textoProduccion;
    } catch(e){
      if(e.message === 'sesion') return;
      msg.textContent = e.message && e.message !== 'fail' ? e.message : 'No se pudo guardar, intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  }

  const ESTATUS_LOGISTICO_OPCIONES = [
    'Preparando', 'Salió del almacén', 'En camino', 'Llegó al lugar',
    'Montando', 'Evento en curso', 'Recolectando', 'Cerrado',
  ];

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function formatFecha(iso){
    if(!iso) return 'Sin fecha aún';
    const [y,m,d] = iso.split('-');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
  }

  function badgeClass(negocio){
    return negocio === 'El Vaso Maiz' ? 'badge-vasomaiz' : 'badge-divanna';
  }

  // Ubicación, servicios y motivos pueden venir del formulario público: siempre escapar.
  function esc(valor){
    return String(valor == null ? '' : valor)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Link a Google Maps con la última ubicación GPS de quien reportó la alerta.
  function linkUbicacion(a){
    if(!/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(a.ubicacionAlerta || '')) return '';
    const hora = a.ubicacionAlertaHora
      ? ' · ' + new Date(a.ubicacionAlertaHora).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })
      : '';
    return `<br><a class="link-mapa" href="https://maps.google.com/?q=${a.ubicacionAlerta}" target="_blank" rel="noopener">📍 Ver ubicación en el mapa${hora}</a>`;
  }

  function renderAlertasEquipo(alertas){
    return (alertas || []).map(a => a.emergencia
      ? `<div class="alerta-equipo"><b>🆘 Emergencia de otra brigada · ${esc(a.folio)}</b>${esc(a.ubicacion)}${a.motivoEmergencia ? ' — ' + esc(a.motivoEmergencia) : ''}<br>Si estás cerca, comunícate con Diana o Víctor.${linkUbicacion(a)}</div>`
      : `<div class="alerta-equipo seguridad"><b>⚠️ Alerta de seguridad · ${esc(a.folio)}</b>Zona: ${esc(a.zonaAlertaSeguridad)}. Eviten la zona si es posible.${linkUbicacion(a)}</div>`
    ).join('');
  }

  function renderEventos(eventos, alertasEquipo){
    const alertasHtml = renderAlertasEquipo(alertasEquipo);
    if(!eventos.length){
      mainContent.innerHTML = alertasHtml + `<div class="empty-state"><div class="big">🗓️</div>Sin eventos asignados por ahora.<br>Vuelve a checar más tarde.</div>`;
      return;
    }

    let html = alertasHtml;
    let lastFecha = null;
    eventos.forEach(ev => {
      const fechaLabel = formatFecha(ev.fecha);
      if(fechaLabel !== lastFecha){
        html += `<div class="day-label">${fechaLabel}</div>`;
        lastFecha = fechaLabel;
      }
      const stages = [
        {key:'salida', label:'Salida'},
        {key:'llegada', label:'Llegada'},
        {key:'montaje', label:'Montaje'},
        {key:'recoleccion', label:'Recolección'},
      ];
      const doneCount = stages.filter(s => ev.checklist[s.key]).length;
      const pct = Math.round((doneCount / stages.length) * 100);

      html += `
        <div class="event-card" data-id="${ev.id}">
          <div class="event-top">
            <div>
              <span class="event-badge ${badgeClass(ev.negocio)}">${esc(ev.negocio || 'Sin clasificar')}</span>
              <h3>${esc(ev.ubicacion || 'Ubicación por confirmar')}</h3>
              <div class="event-folio">${esc(ev.folio)}</div>
            </div>
          </div>
          <div class="event-meta">
            ${ev.horaInicio ? `<span>🕒 Empieza ${esc(ev.horaInicio)}</span>` : ''}
            ${ev.personalRequerido ? `<span>🧑‍🍳 ${ev.personalRequerido} personas</span>` : ''}
            <span>👥 ${ev.invitados ? ev.invitados + ' invitados' : 'Invitados por confirmar'}</span>
            <span>📍 ${esc(ev.estado)}</span>
          </div>
          ${ev.fueraDeCiudad ? `<div class="motivo-tag">🛣️ Fuera de la ciudad</div>` : ''}
          ${ev.enteradoPor
            ? `<div class="enterado-ok">👍 Enterado: ${esc(ev.enteradoPor)}</div>`
            : sesion && sesion.rol !== 'Admin' ? `<button class="enterado-btn" data-evento="${ev.id}">👍 Enterado, ya vi este evento</button>` : ''}
          ${ev.instrucciones ? `<div class="instr-box"><b>📌 Instrucciones</b>${esc(ev.instrucciones)}</div>` : ''}
          ${avisoCambio(ev)}
          ${lineaProduccion(ev)}
          ${bloqueAsignar(ev)}
          ${bloqueStaff(ev)}
          ${ev.servicios ? `<div class="event-services">${esc(ev.servicios)}</div>` : ''}
          ${ev.articulos && ev.articulos.length ? `<div class="instr-box"><b>📦 Cargar exacto (modelo y color)</b>${ev.articulos.map(a => esc(a.cantidad + ' × ' + a.nombre)).join('<br>')}</div>` : ''}

          ${ev.checklistItems && ev.checklistItems.length ? `
            <div class="carga-box">
              <div class="carga-title">📋 Checklist de carga</div>
              ${ev.checklistItems.map((item, i) => `
                <div class="carga-item ${item.marcado ? 'marcado' : ''}" data-evento="${ev.id}" data-idx="${i}">
                  <span class="box">${item.marcado ? '✓' : ''}</span>
                  <span class="texto">${esc(item.texto)}</span>
                </div>
              `).join('')}
              ${ev.checklistItems.some(i => !i.marcado) ? `<div class="carga-warning">⚠️ Falta marcar todo para poder salir del almacén</div>` : ''}
            </div>
          ` : ''}

          <div class="estatus-row">
            <select class="estatus-select" data-evento="${ev.id}" data-tipo="estatus">
              ${ESTATUS_LOGISTICO_OPCIONES.map(op => `<option value="${op}" ${ev.estatusLogistico === op ? 'selected' : ''}>${op}</option>`).join('')}
            </select>
            ${ev.estatusPago ? `<span class="pago-badge ${ev.estatusPago.startsWith('Pagado') || ev.estatusPago === 'Liquidado 100%' ? 'pagado' : 'pendiente'}">💰 ${ev.estatusPago}${ev.montoAdeudado ? ' · $' + ev.montoAdeudado : ''}</span>` : ''}
          </div>

          <div class="alert-actions">
            <div class="alert-btn retraso ${ev.retraso ? 'active' : ''}" data-evento="${ev.id}" data-accion="retraso">🚦 Retraso</div>
            <div class="alert-btn emergencia ${ev.emergencia ? 'active' : ''}" data-evento="${ev.id}" data-accion="emergencia">🆘 Emergencia</div>
            <div class="alert-btn seguridad ${ev.zonaAlertaSeguridad ? 'active' : ''}" data-evento="${ev.id}" data-accion="alerta_seguridad">⚠️ Seguridad</div>
          </div>
          ${ev.retraso && ev.motivoRetraso ? `<div class="motivo-tag">🚦 Retraso: ${esc(ev.motivoRetraso)}</div>` : ''}
          ${ev.emergencia && ev.motivoEmergencia ? `<div class="motivo-tag">🆘 Emergencia: ${esc(ev.motivoEmergencia)}</div>` : ''}
          ${ev.zonaAlertaSeguridad ? `<div class="motivo-tag">⚠️ Zona reportada: ${esc(ev.zonaAlertaSeguridad)}</div>` : ''}
          ${(ev.emergencia || ev.zonaAlertaSeguridad) && linkUbicacion(ev) ? `<div class="motivo-tag">${linkUbicacion(ev).replace('<br>', '')}</div>` : ''}

          <div class="checklist" style="margin-top:14px;">
            ${stages.map(s => `
              <div class="check-item ${ev.checklist[s.key] ? 'done' : ''}" data-evento="${ev.id}" data-etapa="${s.key}">
                <span class="box">${ev.checklist[s.key] ? '✓' : ''}</span> ${s.label}
              </div>
            `).join('')}
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      `;
    });
    // Al repintar (revisión automática) se respetan las cajas que estaban abiertas.
    const abiertas = [...mainContent.querySelectorAll('details[data-caja][open]')].map(d => d.dataset.caja);
    mainContent.innerHTML = html;
    abiertas.forEach(k => { const d = mainContent.querySelector(`details[data-caja="${k}"]`); if(d) d.open = true; });

    document.querySelectorAll('.check-item').forEach(item => {
      item.addEventListener('click', () => toggleChecklist(item));
    });

    document.querySelectorAll('.estatus-select').forEach(sel => {
      sel.addEventListener('change', () => actualizarEstatusLogistico(sel));
      sel.dataset.valorAnterior = sel.value;
    });

    document.querySelectorAll('.carga-item').forEach(item => {
      item.addEventListener('click', () => toggleCargaItem(item));
    });

    document.querySelectorAll('.alert-btn').forEach(btn => {
      btn.addEventListener('click', () => manejarAlerta(btn));
    });

    document.querySelectorAll('.asig-guardar').forEach(btn => {
      btn.addEventListener('click', () => guardarAsignacion(btn));
    });

    document.querySelectorAll('.enterado-btn').forEach(btn => {
      btn.addEventListener('click', () => marcarEnterado(btn));
    });

    document.querySelectorAll('.staff-invitar').forEach(btn => {
      btn.addEventListener('click', () => invitarStaff(btn));
    });
  }

  async function marcarEnterado(btn){
    btn.disabled = true;
    try {
      await enviarEstatus({ eventoId: btn.dataset.evento, tipo: 'enterado' });
      showToast('Listo, Diana y Víctor ya saben que lo viste');
      loadEventos();
    } catch(e){
      btn.disabled = false;
      showToast(e.message && e.message !== 'fail' ? e.message : 'No se pudo confirmar, intenta de nuevo');
    }
  }

  function enviarEstatus(payload){
    return api('/api/brigada-estatus', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
  }

  async function toggleCargaItem(item){
    const eventoId = item.dataset.evento;
    const idx = item.dataset.idx;
    const yaMarcado = item.classList.contains('marcado');
    try {
      await enviarEstatus({ eventoId, tipo: 'checklist_item', valor: idx, motivo: yaMarcado ? 'desmarcar' : 'marcar' });
      loadEventos();
    } catch(e){
      showToast('No se pudo actualizar, intenta de nuevo');
    }
  }

  async function actualizarEstatusLogistico(sel){
    const eventoId = sel.dataset.evento;
    const valorAnterior = sel.dataset.valorAnterior || sel.value;
    try {
      await enviarEstatus({ eventoId, tipo: 'estatus_logistico', valor: sel.value });
      sel.dataset.valorAnterior = sel.value;
      showToast(`Estatus actualizado: ${sel.value}`);
    } catch(e){
      sel.value = valorAnterior;
      showToast(e.message && e.message !== 'fail' ? e.message : 'No se pudo actualizar el estatus, intenta de nuevo');
    }
  }

  // Ubicación GPS del teléfono, o null si no hay permiso/señal en 10 s.
  function obtenerUbicacion(){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
      );
    });
  }

  function textoEnviados(data, base){
    const e = data && data.enviados;
    if(!e) return base;
    return `${base}: ${e.porTelegram} por Telegram, ${e.porPush} por la app${e.correo ? ' y correo' : ''}`;
  }

  // Mientras uno de mis eventos tenga una emergencia o alerta de seguridad
  // activa y la app siga abierta, mando mi ubicación cada minuto para que el
  // equipo vea en el mapa dónde estoy. Los Admin (vista equipo) no la mandan.
  let seguimientoTimer = null;
  let eventosEnAlerta = [];
  function actualizarSeguimiento(eventos){
    eventosEnAlerta = sesion && sesion.rol !== 'Admin'
      ? (eventos || []).filter(ev => ev.emergencia || ev.zonaAlertaSeguridad)
      : [];
    if(!eventosEnAlerta.length){
      if(seguimientoTimer){ clearInterval(seguimientoTimer); seguimientoTimer = null; }
      return;
    }
    if(seguimientoTimer) return;
    seguimientoTimer = setInterval(async () => {
      const ubicacion = await obtenerUbicacion();
      if(!ubicacion || !sesion) return;
      for(const ev of eventosEnAlerta){
        enviarEstatus({ eventoId: ev.id, tipo: 'ubicacion', ubicacion }).catch(() => {});
      }
    }, 60000);
  }

  async function manejarAlerta(btn){
    const eventoId = btn.dataset.evento;
    const accion = btn.dataset.accion;

    if(accion === 'retraso' || accion === 'emergencia'){
      const activando = !btn.classList.contains('active');
      // El GPS se pide desde ya para que esté listo cuando terminen de escribir el motivo.
      const ubicacionPendiente = accion === 'emergencia' && activando ? obtenerUbicacion() : Promise.resolve(null);
      let motivo = '';
      if(activando){
        motivo = prompt(accion === 'retraso' ? '¿Cuál es el motivo del retraso?' : '¿Qué pasó? (ej. choqué, se descompuso la unidad)') || '';
        if(!motivo){ return; }
      }
      try {
        if(accion === 'emergencia' && activando) showToast('📍 Enviando alerta con tu ubicación…');
        const ubicacion = await ubicacionPendiente;
        const data = await enviarEstatus({ eventoId, tipo: accion, valor: activando, motivo, ubicacion });
        btn.classList.toggle('active', activando);
        showToast(accion === 'emergencia' && activando ? textoEnviados(data, '🆘 Alerta enviada')
          : accion === 'emergencia' ? '✅ Emergencia resuelta' : 'Actualizado');
        loadEventos();
      } catch(e){
        showToast('No se pudo enviar, intenta de nuevo');
      }
    }

    if(accion === 'alerta_seguridad' && btn.classList.contains('active')){
      // Ya hay alerta de seguridad: tocar otra vez la levanta.
      if(!confirm('¿Ya pasó la situación de seguridad? Se quitará la alerta para todo el equipo.')) return;
      try {
        await enviarEstatus({ eventoId, tipo: 'alerta_seguridad', valor: false });
        showToast('✅ Alerta de seguridad levantada');
        loadEventos();
      } catch(e){
        showToast(e.message && e.message !== 'fail' ? e.message : 'No se pudo quitar, intenta de nuevo');
      }
      return;
    }

    if(accion === 'alerta_seguridad'){
      const ubicacionPendiente = obtenerUbicacion();
      const zona = prompt('¿En qué zona o calle? (se notificará a todo el equipo)') || '';
      if(!zona) return;
      try {
        const ubicacion = await ubicacionPendiente;
        const data = await enviarEstatus({ eventoId, tipo: 'alerta_seguridad', valor: true, motivo: zona, ubicacion });
        showToast(textoEnviados(data, '⚠️ Alerta de seguridad enviada'));
        // Ya no hay mensaje automático al cliente: la brigada se lo dice por teléfono.
        if(data && data.mensajeCliente) alert('Avísale al cliente por teléfono:\n\n' + data.mensajeCliente);
        loadEventos();
      } catch(e){
        showToast('No se pudo enviar, intenta de nuevo');
      }
    }
  }

  async function toggleChecklist(item){
    const eventoId = item.dataset.evento;
    const etapa = item.dataset.etapa;
    const nuevoValor = !item.classList.contains('done');

    item.classList.toggle('done');
    item.querySelector('.box').textContent = nuevoValor ? '✓' : '';

    try {
      await api('/api/brigada-checklist', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ eventoId, etapa, valor: nuevoValor }),
      });
      showToast(nuevoValor ? `${etapa} marcado ✓` : `${etapa} desmarcado`);
      recalcProgress(item.closest('.event-card'));
    } catch(e){
      // revertir si falla
      item.classList.toggle('done');
      item.querySelector('.box').textContent = item.classList.contains('done') ? '✓' : '';
      showToast('No se pudo guardar, intenta de nuevo');
    }
  }

  function recalcProgress(card){
    const items = card.querySelectorAll('.check-item');
    const done = card.querySelectorAll('.check-item.done').length;
    const pct = Math.round((done / items.length) * 100);
    card.querySelector('.progress-fill').style.width = pct + '%';
  }

  const ROL_TEXTO = {
    'Lider de brigada': 'Líder de brigada',
    'Asistente': 'Asistente',
    'Encargada de evento': 'Encargada de evento',
  };

  function mostrarApp(){
    loginScreen.style.display = 'none';
    appScreen.style.display = 'flex';
  }

  // Con la app abierta revisa cada 45 s si hay alertas nuevas (suena y vibra
  // con DimaAlertas). Con la app cerrada, las alertas llegan por push.
  let revisionTimer = null;
  let ultimaFoto = null;
  function iniciarRevision(){
    DimaAlertas.iniciar({ contenedorBoton: $('alertasBanner'), token: () => sesion && sesion.token });
    if(revisionTimer) clearInterval(revisionTimer);
    revisionTimer = setInterval(() => {
      if(sesion && document.visibilityState === 'visible') loadEventos(true);
    }, 45000);
  }

  function clavesDeAlertas(data){
    const claves = [];
    (data.alertasEquipo || []).forEach(a => {
      if(a.emergencia) claves.push(`${a.folio}|E|${a.motivoEmergencia}`);
      if(a.zonaAlertaSeguridad) claves.push(`${a.folio}|S|${a.zonaAlertaSeguridad}`);
    });
    (data.eventos || []).forEach(ev => {
      if(ev.emergencia) claves.push(`${ev.id}|E|${ev.motivoEmergencia}`);
      if(ev.zonaAlertaSeguridad) claves.push(`${ev.id}|S|${ev.zonaAlertaSeguridad}`);
    });
    return claves;
  }

  function cerrarSesion(mensaje){
    try { localStorage.removeItem(SESION_KEY); sessionStorage.removeItem('dima_equipo'); } catch(e){}
    dimaHistorial = [];
    $('dimaPanel').hidden = true;
    $('dimaFab').hidden = true;
    sesion = null;
    if(revisionTimer) clearInterval(revisionTimer);
    revisionTimer = null;
    if(seguimientoTimer) clearInterval(seguimientoTimer);
    seguimientoTimer = null;
    ultimaFoto = null;
    DimaAlertas.reiniciar();
    document.body.classList.remove('rol-asistente');
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    pinInput.value = '';
    loginError.textContent = mensaje || '';
  }

  // Diana y Víctor (Admin) entran al dashboard. Con ?vista=equipo ven esta
  // misma app como la ve cada brigada o encargada (barra "Ver como").
  const VISTA_EQUIPO = new URLSearchParams(location.search).get('vista') === 'equipo';
  function irSegunRol(){
    if(sesion.rol === 'Admin' && !VISTA_EQUIPO){ location.replace('dashboard.html'); return false; }
    $('vistaAdmin').hidden = sesion.rol !== 'Admin';
    document.body.classList.toggle('rol-asistente', sesion.rol === 'Asistente' || (sesion.rol === 'Admin' && $('vistaAsistente').checked));
    return true;
  }

  function pintarOpcionesVista(opciones){
    const sel = $('vistaComo');
    if(!opciones || sel.dataset.listo) return;
    sel.dataset.listo = '1';
    const grupo = (titulo, lista, tipo) => lista.length
      ? `<optgroup label="${titulo}">${lista.map(o => `<option value="${tipo}:${esc(o.id)}">${esc(o.nombre)}</option>`).join('')}</optgroup>`
      : '';
    sel.insertAdjacentHTML('beforeend', grupo('Brigadas', opciones.brigadas, 'brigada') + grupo('Encargadas (Vaso Maíz)', opciones.encargadas, 'encargada'));
  }

  function urlEventos(){
    if(!sesion || sesion.rol !== 'Admin') return '/api/brigada-eventos';
    const [tipo, id] = ($('vistaComo').value || '').split(':');
    return tipo ? `/api/brigada-eventos?${tipo}=${encodeURIComponent(id)}` : '/api/brigada-eventos';
  }

  $('vistaComo').addEventListener('change', () => { ultimaFoto = null; loadEventos(); });
  $('vistaAsistente').addEventListener('change', () => {
    document.body.classList.toggle('rol-asistente', $('vistaAsistente').checked);
  });

  // silencioso: revisión automática, sin "Cargando…" y sin repintar si nada cambió.
  async function loadEventos(silencioso){
    if(!silencioso) mainContent.innerHTML = `<div class="loader"><div class="spinner"></div> Cargando eventos…</div>`;
    try {
      const data = await api(urlEventos());
      pintarOpcionesVista(data.opciones);
      DimaAlertas.revisar(clavesDeAlertas(data));
      actualizarSeguimiento(data.eventos);
      const foto = JSON.stringify([data.eventos, data.alertasEquipo, data.staffEventos || null]);
      if(silencioso && foto === ultimaFoto) return;
      ultimaFoto = foto;
      const rolTexto = data.colaborador.gerente ? 'Gerente de El Vaso Maíz' : (ROL_TEXTO[data.colaborador.rol] || data.colaborador.rol);
      opcionesAsignar = data.opcionesAsignar || null;
      staffEventos = data.staffEventos || null;
      staffError = !!data.staffError;
      $('dimaFab').hidden = !data.colaborador.gerente || !$('dimaPanel').hidden;
      if(data.colaborador.rol === 'Admin'){
        const sel = $('vistaComo');
        $('brigadaNombre').textContent = 'Vista equipo';
        $('brigadaDetalle').textContent = `${data.colaborador.nombre} · viendo: ${sel.options[sel.selectedIndex].text}`;
      } else if(data.brigada){
        $('brigadaNombre').textContent = data.brigada.nombre;
        $('brigadaDetalle').textContent = `${data.colaborador.nombre} · ${rolTexto}${data.brigada.vehiculo ? ' · 🚗 ' + data.brigada.vehiculo : ''}`;
      } else {
        $('brigadaNombre').textContent = data.colaborador.nombre;
        $('brigadaDetalle').textContent = rolTexto;
      }
      renderEventos(data.eventos, data.alertasEquipo);
      mostrarApp();
    } catch(e){
      if(e.message === 'sesion' || silencioso) return;
      mainContent.innerHTML = `<div class="empty-state"><div class="big">📡</div>No se pudieron cargar tus eventos.<br>Revisa tu señal y toca actualizar.</div>`;
      mostrarApp();
    }
  }

  loginBtn.addEventListener('click', async () => {
    const usuario = usuarioInput.value.trim().toLowerCase();
    const pin = pinInput.value.trim();
    if(!usuario || !/^\d{6}$/.test(pin)){ loginError.textContent = 'Escribe tu usuario y tu PIN de 6 dígitos.'; return; }
    loginError.textContent = '';
    loginBtn.disabled = true;
    try {
      const res = await fetch('/api/sesion', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ usuario, pin }),
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || 'No se pudo entrar, intenta de nuevo.');
      sesion = { token: data.token, nombre: data.colaborador.nombre, rol: data.colaborador.rol };
      guardarSesion(sesion);
      pinInput.value = '';
      if(irSegunRol()){ iniciarRevision(); await loadEventos(); }
    } catch(e){
      loginError.textContent = e.message;
    } finally {
      loginBtn.disabled = false;
    }
  });

  pinInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') loginBtn.click(); });
  usuarioInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') pinInput.focus(); });

  // ---------- Canal con DiMa (solo la gerente) ----------
  // La plática vive en el navegador (sessionStorage) y se manda completa.
  const DIMA_KEY = 'dima_equipo';
  var dimaHistorial = [];
  try { dimaHistorial = JSON.parse(sessionStorage.getItem(DIMA_KEY) || '[]'); } catch(e){ dimaHistorial = []; }

  function pintarDima(){
    const saludo = [{ rol: 'dima', texto: 'Hola 👋 Soy DiMa. Pregúntame lo que necesites de la app, Telegram, el staff o tus eventos.' }];
    $('dimaMsgs').innerHTML = [...saludo, ...dimaHistorial].map(m => `<div class="dima-msg ${m.rol}">${esc(m.texto)}</div>`).join('');
    $('dimaMsgs').scrollTop = $('dimaMsgs').scrollHeight;
  }

  async function enviarDima(e){
    e.preventDefault();
    const texto = $('dimaTexto').value.trim();
    if(!texto) return;
    $('dimaTexto').value = '';
    dimaHistorial.push({ rol: 'yo', texto });
    pintarDima();
    $('dimaMsgs').insertAdjacentHTML('beforeend', '<div class="dima-msg dima" id="dimaEscribiendo">Escribiendo…</div>');
    try {
      const d = await api('/api/dima-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ modo: 'equipo', historial: dimaHistorial.slice(-20) }),
      });
      dimaHistorial.push({ rol: 'dima', texto: d.texto });
    } catch(err){
      if(err.message === 'sesion') return;
      dimaHistorial.pop();
      $('dimaTexto').value = texto;
      showToast(err.message && err.message !== 'fail' ? err.message : 'DiMa no pudo contestar, intenta de nuevo');
    }
    sessionStorage.setItem(DIMA_KEY, JSON.stringify(dimaHistorial.slice(-20)));
    pintarDima();
  }

  $('dimaFab').addEventListener('click', () => { $('dimaPanel').hidden = false; $('dimaFab').hidden = true; pintarDima(); $('dimaTexto').focus(); });
  $('dimaCerrar').addEventListener('click', () => { $('dimaPanel').hidden = true; $('dimaFab').hidden = false; });
  $('dimaNueva').addEventListener('click', () => { dimaHistorial = []; sessionStorage.removeItem(DIMA_KEY); pintarDima(); });
  $('dimaForm').addEventListener('submit', enviarDima);

  refreshBtn.addEventListener('click', () => {
    if(!sesion) return;
    refreshBtn.classList.add('spinning');
    loadEventos().finally(() => refreshBtn.classList.remove('spinning'));
  });

  $('logoutBtn').addEventListener('click', () => cerrarSesion());

  // Si ya hay sesión guardada, entra directo.
  if(sesion && sesion.token && irSegunRol()){
    iniciarRevision();
    loadEventos();
  }

  // Registrar service worker para que la app sea instalable
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/brigadas/sw.js').catch(() => {});
  }
</script>
</body>
</html>
