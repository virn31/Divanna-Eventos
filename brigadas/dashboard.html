<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0b10">
<title>DiMa Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0b10; --ink-2:#151319; --ink-3:#1d1b23;
    --paper:#f6f1ea;
    --divanna:#b98bff; --maiz:#f0b93a;
    --line: rgba(246,241,234,0.14);
    --muted: rgba(246,241,234,0.6);
    --good:#7fd88f; --warn:#f0b93a; --bad:#ff6b6b; --sec:#ff9f4a;
    /* Paleta cálida y distinguible por etapa (color + ícono, nunca solo color) */
    --e-preparando:#9aa0ae;
    --e-salio:#5aa9e6;
    --e-camino:#f0b93a;
    --e-llego:#4fd8c4;
    --e-montando:#b98bff;
    --e-curso:#ff8bc6;
    --e-recolectando:#8b93ff;
    --e-cerrado:#39e991;
    --e-seguridad:#ff5252;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink); color:var(--paper);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:700;margin:0;}
  button{font-family:inherit;} input{font-family:inherit;}

  #appScreen{display:flex; min-height:100vh; flex-direction:column;}
  .appbar-actions{display:flex; gap:8px; align-items:center;}
  .vista-equipo-btn{
    background:var(--ink-2); border:1px solid var(--divanna); color:var(--paper); text-decoration:none;
    border-radius:100px; padding:9px 14px; font-weight:800; font-size:0.82rem; white-space:nowrap;
  }
  header.appbar{
    position:sticky; top:0; z-index:20; background:rgba(12,11,16,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:calc(18px + var(--safe-top)) 20px 18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .icon-btn{
    background:var(--ink-2); border:1px solid var(--line); color:var(--paper);
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:1.1rem;
  }
  main{flex:1; padding:20px 18px 60px; max-width:900px; margin:0 auto; width:100%;}

  .summary-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px;}
  .summary-card{background:var(--ink-2); border:1px solid var(--line); border-radius:18px; padding:18px 12px; text-align:center;}
  .summary-card .num{font-family:'Fraunces',serif; font-size:1.9rem; font-weight:700;}
  .summary-card .label{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px;}
  .summary-card.alerta{border-color:var(--bad); background:rgba(255,107,107,0.08);}
  .summary-card.alerta .num{color:var(--bad);}

  .evento-row{
    background:var(--ink-2); border:1px solid var(--line); border-left:5px solid var(--e-preparando);
    border-radius:18px; padding:18px 20px; margin-bottom:14px; transition:transform .15s;
  }
  .evento-row.emergencia{border-color:var(--bad); border-left-color:var(--bad); background:rgba(255,107,107,0.08);}
  .evento-row.seguridad{border-color:var(--e-seguridad); border-left-color:var(--e-seguridad); background:rgba(255,82,82,0.07);}
  .evento-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap;}
  .evento-top h3{font-size:1.08rem;}
  .evento-sub{font-size:0.83rem; color:var(--muted); margin-top:3px;}
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:0.75rem; font-weight:800; padding:7px 12px; border-radius:100px; white-space:nowrap;}
  .badge-pago-pendiente{background:rgba(240,185,58,0.18); color:var(--warn);}
  .badge-pago-pagado{background:rgba(57,233,145,0.18); color:var(--e-cerrado);}
  .badge-emergencia{background:rgba(255,107,107,0.22); color:var(--bad);}
  .badge-seguridad{background:rgba(255,82,82,0.2); color:var(--e-seguridad);}
  .meta-line{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:0.86rem; color:var(--muted);}
  .motivo{font-size:0.83rem; margin-top:10px; padding:10px 12px; background:var(--ink); border-radius:12px; border:1px solid var(--line);}
  .badge-fuera{background:rgba(255,159,74,0.2); color:var(--sec);}
  .aviso-fuera{border-color:var(--sec); color:var(--sec);}
  /* Instrucciones para el equipo (se ven en la app de la brigada/encargada y en Telegram) */
  .instr{margin-top:12px; font-size:0.85rem;}
  .instr summary{cursor:pointer; font-weight:700; color:var(--divanna);}
  .instr textarea, .pedido-card .pedido-instr{
    width:100%; min-height:70px; margin-top:8px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--ink); color:var(--paper); font:inherit; font-size:0.9rem; resize:vertical; outline:none;
  }
  .instr textarea:focus{border-color:var(--divanna);}
  .instr-fila{display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap;}
  .instr-guardar{border:none; border-radius:10px; padding:9px 14px; background:var(--divanna); color:var(--ink); font-weight:800; cursor:pointer;}
  .instr-guardar:disabled{opacity:.5;}
  .instr-msg{font-size:0.8rem; color:var(--muted);}
  .msgcli{margin-top:12px; font-size:0.85rem;}
  .msgcli summary{cursor:pointer; font-weight:700; color:var(--maiz);}
  .msgcli textarea{
    width:100%; min-height:70px; margin-top:8px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--ink); color:var(--paper); font:inherit; font-size:0.9rem; resize:vertical; outline:none;
  }
  .msgcli textarea:focus{border-color:var(--maiz);}
  .msgcli-enviar{border:none; border-radius:10px; padding:9px 14px; background:var(--maiz); color:var(--ink); font-weight:800; cursor:pointer;}
  .msgcli-enviar:disabled{opacity:.5;}
  .badge-pref{background:rgba(185,139,255,0.18); color:var(--divanna);}
  .resolver-btn{border:none; border-radius:10px; padding:10px 14px; background:var(--good); color:var(--ink); font-weight:800; cursor:pointer;}
  .resolver-btn:disabled{opacity:.5;}

  /* Pedidos de la landing por cotizar (antes Diana respondía SI/NO por WhatsApp) */
  .section-title{font-size:1.15rem; margin:4px 0 12px;}
  .pedido-card{background:var(--ink-2); border:1px solid var(--maiz); border-radius:18px; padding:18px 20px; margin-bottom:14px;}
  .pedido-card .servicios{white-space:pre-wrap; font-size:0.88rem; margin-top:10px; padding:10px 12px; background:var(--ink); border-radius:12px; border:1px solid var(--line);}
  .pedido-card label{display:block; font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin:14px 0 6px;}
  .pedido-card input, .pedido-card textarea{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--ink); color:var(--paper); font-size:0.95rem; font-family:inherit; outline:none;
  }
  .pedido-card input:focus, .pedido-card textarea:focus{border-color:var(--divanna);}
  .pedido-card textarea{min-height:96px; resize:vertical;}
  .pedido-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .pedido-actions button{flex:1; min-width:130px; padding:13px; border-radius:12px; font-weight:800; font-size:0.92rem; cursor:pointer;}
  .btn-autorizar{background:var(--good); color:var(--ink); border:none;}
  .btn-rechazar{background:transparent; color:var(--bad); border:1.5px solid var(--bad);}
  .pedido-actions button:disabled{opacity:0.5; cursor:default;}
  .pedido-msg{font-size:0.85rem; margin-top:10px; min-height:18px;}
  .pedido-contacto a{color:var(--divanna);}
  /* Semáforo de agenda (verde / amarillo / rojo) */
  .semaforo{margin-top:12px; padding:12px 14px; border-radius:14px; border:1.5px solid var(--line); font-size:0.86rem;}
  .semaforo .sem-titulo{font-weight:800; font-size:1rem;}
  .semaforo ul{margin:8px 0 0; padding-left:18px;}
  .semaforo li{margin:4px 0;}
  .semaforo li.info{color:var(--muted);}
  .sem-verde{border-color:var(--good); background:rgba(57,233,145,0.10);}
  .sem-amarillo{border-color:var(--warn); background:rgba(240,185,58,0.12);}
  .sem-rojo{border-color:var(--bad); background:rgba(255,107,107,0.14);}
  .badge-sem-verde{background:rgba(57,233,145,0.18); color:var(--good);}
  .badge-sem-amarillo{background:rgba(240,185,58,0.18); color:var(--warn);}
  .badge-sem-rojo{background:rgba(255,107,107,0.22); color:var(--bad);}
  .limite{margin-top:10px; font-size:0.85rem; font-weight:700;}
  .limite.vencido{color:var(--bad);}
  /* Hora y productos estructurados (agenda, inventario y personal) */
  .capacidad{white-space:pre-wrap; border-color:var(--divanna);}
  .agenda{margin-top:12px; font-size:0.85rem;}
  .agenda > summary{cursor:pointer; font-weight:700; color:var(--divanna);}
  .agenda-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .agenda .ag-label{display:block; font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin:12px 0 6px;}
  .agenda select, .agenda input{
    width:100%; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--ink); color:var(--paper); font-size:0.9rem; font-family:inherit; outline:none; min-width:0;
  }
  .agenda select:focus, .agenda input:focus{border-color:var(--divanna);}
  .prod-fila{display:grid; grid-template-columns:minmax(0,1fr) 76px 40px; gap:6px; margin-top:8px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .prod-fila .prod-nota{grid-column:1 / -1;}
  .prod-quitar{border:1.5px solid var(--bad); background:transparent; color:var(--bad); border-radius:10px; cursor:pointer; font-weight:800;}
  .prod-agregar{margin-top:8px; border:1.5px dashed var(--divanna); background:transparent; color:var(--divanna); border-radius:10px; padding:9px 14px; font-weight:800; cursor:pointer;}
  .balance-card{background:var(--ink-2); border:1px solid var(--line); border-radius:18px; padding:16px 20px; margin-bottom:20px;}
  .balance-card summary{cursor:pointer; font-weight:700;}
  .balance-card pre{white-space:pre-wrap; font-family:inherit; font-size:0.88rem; color:var(--muted); margin:12px 0 0;}

  .alertas-banner{
    max-width:900px; margin:14px auto 0; width:calc(100% - 36px); padding:12px 14px; border-radius:14px; font-size:0.85rem; line-height:1.4;
    background:rgba(240,185,58,0.12); border:1.5px solid var(--warn); display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  }
  .alertas-banner[hidden]{display:none;}
  .alertas-banner span{flex:1; min-width:180px;}
  .alertas-banner button{border:none; border-radius:10px; padding:10px 14px; background:var(--maiz); color:var(--ink); font-weight:800; cursor:pointer;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .loader{display:flex; align-items:center; justify-content:center; padding:60px 0; color:var(--muted); gap:10px;}
  .spinner{width:20px; height:20px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--maiz); animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="appScreen">
  <header class="appbar">
    <h2>Dashboard general</h2>
    <div class="appbar-actions">
      <a class="vista-equipo-btn" href="./?vista=equipo">👥 Vista equipo</a>
      <button class="icon-btn" id="refreshBtn" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="icon-btn" id="logoutBtn" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>
  <div id="alertasBanner" class="alertas-banner" hidden></div>
  <main>
    <div id="pedidosContent"></div>
    <div id="balanceContent"></div>
    <div id="mainContent">
      <div class="loader"><div class="spinner"></div> Cargando eventos…</div>
    </div>
  </main>
</div>

<script src="alertas.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // Sesión compartida con /brigadas/ (mismo origen). Solo el rol Admin entra aquí.
  const SESION_KEY = 'dima_sesion';
  let sesion = null;
  try { sesion = JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); } catch(e){}
  if(!sesion || !sesion.token || sesion.rol !== 'Admin') location.replace('./');

  function salir(){
    try { localStorage.removeItem(SESION_KEY); } catch(e){}
    location.replace('./');
  }

  // fetch con el token de sesión; 401/403 regresan al login.
  async function api(url, opciones = {}){
    const res = await fetch(url, {
      ...opciones,
      headers: { ...(opciones.headers || {}), Authorization: `Bearer ${sesion ? sesion.token : ''}` },
    });
    const data = await res.json().catch(() => ({}));
    if(res.status === 401 || res.status === 403){ salir(); throw new Error('sesion'); }
    if(!res.ok) throw new Error(data.error || 'Error');
    return data;
  }

  const mainContent = $('mainContent');
  const refreshBtn = $('refreshBtn');

  const pedidosContent = $('pedidosContent');
  const balanceContent = $('balanceContent');

  let pollTimer = null;
  let pedidosFirma = null;
  // Catálogo de productos (clave, nombre, negocio) que manda el servidor.
  let catalogo = [];
  // Artículos de INVENTARIO (modelo y color) para asignar a cada evento.
  let inventario = [];

  // Varios campos vienen del formulario público de la landing: siempre escapar.
  function esc(valor){
    return String(valor == null ? '' : valor)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // Cada etapa tiene su propio color E icono -- nunca solo color, para accesibilidad.
  const ESTATUS_VISUAL = {
    'Preparando':            { color: '--e-preparando', icon: '📦' },
    'Salió del almacén':     { color: '--e-salio',      icon: '🚛' },
    'En camino':             { color: '--e-camino',     icon: '🚗' },
    'Llegó al lugar':        { color: '--e-llego',      icon: '📍' },
    'Montando':              { color: '--e-montando',   icon: '🔧' },
    'Evento en curso':       { color: '--e-curso',       icon: '🎉' },
    'Recolectando':          { color: '--e-recolectando',icon: '📥' },
    'Cerrado':               { color: '--e-cerrado',     icon: '✅' },
    'Retraso - situación de seguridad en la ciudad': { color: '--e-seguridad', icon: '⚠️' },
  };
  function estatusVisual(estatus){
    return ESTATUS_VISUAL[estatus] || { color: '--e-preparando', icon: '📦' };
  }

  function formatFecha(iso){
    if(!iso) return 'Sin fecha';
    const [y,m,d] = iso.split('-');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${parseInt(d)} ${meses[parseInt(m)-1]}`;
  }

  function renderResumen(eventos){
    const emergencias = eventos.filter(e => e.emergencia).length;
    const enCurso = eventos.filter(e => ['En camino','Montando','Evento en curso'].includes(e.estatusLogistico)).length;
    const pendientesPago = eventos.filter(e => e.estatusPago && e.estatusPago.startsWith('Pendiente')).length;
    return `
      <div class="summary-row">
        <div class="summary-card ${emergencias ? 'alerta' : ''}"><div class="num">${emergencias}</div><div class="label">Emergencias</div></div>
        <div class="summary-card"><div class="num">${enCurso}</div><div class="label">En curso hoy</div></div>
        <div class="summary-card"><div class="num">${pendientesPago}</div><div class="label">Pagos pendientes</div></div>
      </div>
    `;
  }

  const PREF_TEXTO = { 'Esperar en el chat': 'Espera respuesta en el chat', 'Mensaje': 'Prefiere mensaje', 'Llamada': 'Prefiere llamada' };

  // "Mensaje para el cliente": Diana lo escribe y DiMa se lo entrega en el chat.
  function bloqueMensajeCliente(item){
    const estado = !item.mensajeParaCliente ? ''
      : item.mensajeEntregado ? '✔ DiMa ya se lo entregó.' : '⏳ DiMa se lo entrega cuando el cliente esté en el chat o regrese con su número de pedido.';
    const pref = item.preferenciaContacto === 'Mensaje' || item.preferenciaContacto === 'Llamada'
      ? `<div class="evento-sub">El cliente ${item.preferenciaContacto === 'Llamada' ? 'prefiere que le llamen' : 'prefiere que le escriban'}: contáctalo también por fuera del chat.</div>` : '';
    return `
      <details class="msgcli" ${item.mensajeParaCliente && !item.mensajeEntregado ? 'open' : ''}>
        <summary>💬 Mensaje para el cliente${item.mensajeParaCliente ? '' : ' (DiMa se lo entrega)'}</summary>
        ${pref}
        <textarea class="msgcli-texto" maxlength="1500" placeholder="Ej. Sí llegamos a San Pedro; el traslado son $500 y el total queda en $3,200. ¿Lo confirmas?">${esc(item.mensajeParaCliente)}</textarea>
        <div class="instr-fila">
          <button class="msgcli-enviar" data-id="${esc(item.id)}">Enviar al cliente</button>
          <span class="instr-msg">${estado}</span>
        </div>
      </details>`;
  }

  async function enviarMensajeCliente(btn){
    const caja = btn.closest('.msgcli');
    const texto = caja.querySelector('.msgcli-texto');
    const msg = caja.querySelector('.instr-msg');
    if(!texto.value.trim()){ msg.textContent = 'Escribe el mensaje primero.'; return; }
    btn.disabled = true;
    msg.textContent = 'Enviando…';
    try {
      await api('/api/dashboard-eventos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventoId: btn.dataset.id, accion: 'mensaje_cliente', mensaje: texto.value }),
      });
      delete texto.dataset.sucio;
      msg.textContent = '⏳ Listo. DiMa se lo entrega cuando el cliente esté en el chat o regrese con su número de pedido.';
    } catch(e){
      if(e.message === 'sesion') return;
      msg.textContent = e.message || 'No se pudo enviar, intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  }

  function conectarMensajeCliente(contenedor){
    contenedor.querySelectorAll('.msgcli-texto').forEach(t => t.addEventListener('input', () => { t.dataset.sucio = '1'; }));
    contenedor.querySelectorAll('.msgcli-enviar').forEach(b => b.addEventListener('click', () => enviarMensajeCliente(b)));
  }

  // ---------- Semáforo de agenda ----------
  const SEMAFORO = {
    verde: { icono: '🟢', titulo: 'Hay disponibilidad' },
    amarillo: { icono: '🟡', titulo: 'Se puede, con condiciones' },
    rojo: { icono: '🔴', titulo: 'No alcanza' },
  };

  // Recuadro completo (pedidos por cotizar): color, título y por qué.
  function bloqueSemaforo(disp){
    if(!disp) return '';
    const s = SEMAFORO[disp.nivel];
    return `
      <div class="semaforo sem-${disp.nivel}">
        <div class="sem-titulo">${s.icono} ${s.titulo}</div>
        ${disp.motivos.length ? `<ul>${disp.motivos.map(m => `<li class="${m.nivel}">${esc(m.texto)}</li>`).join('')}</ul>` : ''}
      </div>`;
  }

  // Etiqueta corta (eventos ya autorizados).
  function badgeSemaforo(disp){
    if(!disp) return '';
    const s = SEMAFORO[disp.nivel];
    return `<span class="badge badge-sem-${disp.nivel}">${s.icono} ${s.titulo}</span>`;
  }

  // Staff de El Vaso Maíz invitado por Telegram (/staff) y su respuesta.
  const ICONO_STAFF = { 'Confirmó': '✅', 'Invitada': '⏳', 'No puede': '❌' };
  function bloqueStaff(ev){
    if(!ev.personalRequerido && !(ev.staff || []).length) return '';
    const confirmadas = (ev.staff || []).filter(s => s.estado === 'Confirmó').length;
    const lista = (ev.staff || []).map(s => `${esc(s.nombre)} ${ICONO_STAFF[s.estado] || ''}`).join(' · ');
    return `<div class="motivo">🧑‍🍳 Staff: ${confirmadas} de ${ev.personalRequerido || '?'} confirmadas${lista ? ' — ' + lista : ' — aún sin invitar (la coordinadora usa /staff en Telegram)'}</div>`;
  }

  // Plazo de 12 h que DiMa le prometió al cliente.
  function bloqueLimite(iso){
    if(!iso) return '';
    const limite = new Date(iso);
    const minutos = Math.round((limite - Date.now()) / 60000);
    const hora = limite.toLocaleString('es-MX', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
    const falta = Math.abs(minutos) >= 60 ? `${Math.floor(Math.abs(minutos) / 60)} h ${Math.abs(minutos) % 60} min` : `${Math.abs(minutos)} min`;
    return minutos >= 0
      ? `<div class="limite">⏱️ Confirmar al cliente antes de: ${esc(hora)} (quedan ${falta})</div>`
      : `<div class="limite vencido">⚠️ Se venció el plazo de 12 h (${esc(hora)}, hace ${falta}). Contacta al cliente.</div>`;
  }

  // ---------- Hora y productos (agenda, inventario y personal) ----------
  function opcionesCatalogo(seleccion){
    const grupos = {};
    catalogo.forEach(p => { (grupos[p.negocio || 'Otros'] = grupos[p.negocio || 'Otros'] || []).push(p); });
    return Object.entries(grupos).map(([negocio, lista]) =>
      `<optgroup label="${esc(negocio)}">${lista.map(p => `<option value="${esc(p.clave)}" ${p.clave === seleccion ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</optgroup>`
    ).join('');
  }

  function filaProducto(p){
    return `
      <div class="prod-fila">
        <select class="prod-clave" aria-label="Producto">${opcionesCatalogo(p.clave)}</select>
        <input type="number" class="prod-cant" min="1" step="1" inputmode="numeric" value="${esc(p.cantidad || 1)}" aria-label="Cantidad">
        <button type="button" class="prod-quitar" aria-label="Quitar producto">✕</button>
        <input class="prod-nota" maxlength="150" placeholder="Nota: color, sabor, variante…" value="${esc(p.nota || '')}">
      </div>`;
  }

  function opcionesInventario(seleccion){
    const grupos = {};
    inventario.forEach(i => { (grupos[i.categoria] = grupos[i.categoria] || []).push(i); });
    return Object.entries(grupos).map(([cat, lista]) =>
      `<optgroup label="${esc(cat)}">${lista.map(i => `<option value="${esc(i.id)}" ${i.id === seleccion ? 'selected' : ''}>${esc(i.nombre)} (${esc(i.total)})</option>`).join('')}</optgroup>`
    ).join('');
  }

  function filaArticulo(a){
    return `
      <div class="prod-fila art-fila">
        <select class="art-id" aria-label="Modelo y color">${opcionesInventario(a.id)}</select>
        <input type="number" class="art-cant" min="1" step="1" inputmode="numeric" value="${esc(a.cantidad || 1)}" aria-label="Cantidad">
        <button type="button" class="prod-quitar art-quitar" aria-label="Quitar artículo">✕</button>
      </div>`;
  }

  // Campos de hora, horas de servicio y productos. Se usan en los pedidos por
  // cotizar y en los eventos ya autorizados.
  function camposAgenda(item){
    return `
      <div class="agenda-grid">
        <div><label class="ag-label">Hora de inicio</label><input type="time" class="ag-hora" value="${esc(item.horaInicio)}"></div>
        <div><label class="ag-label">Horas de servicio (Vaso Maíz)</label><input type="number" class="ag-horas" min="0.5" max="24" step="0.5" inputmode="decimal" placeholder="2" value="${item.horasServicio ? esc(item.horasServicio) : ''}"></div>
      </div>
      <label class="ag-label">Productos (para inventario y personal)</label>
      <div class="prod-lista">${(item.productos || []).map(filaProducto).join('')}</div>
      <button type="button" class="prod-agregar">+ Agregar producto</button>
      <label class="ag-label">Modelo, color y cantidad (lo que carga la brigada)</label>
      ${item.porAsignar ? `<div class="motivo aviso-fuera">🎨 Falta asignar modelo y color: ${esc(item.porAsignar)}</div>` : ''}
      <div class="art-lista">${(item.articulos || []).map(filaArticulo).join('')}</div>
      <button type="button" class="prod-agregar art-agregar">+ Agregar modelo y color</button>`;
  }

  function leerAgenda(contenedor){
    return {
      horaInicio: contenedor.querySelector('.ag-hora').value,
      horasServicio: contenedor.querySelector('.ag-horas').value,
      articulos: [...contenedor.querySelectorAll('.art-fila')].map(f => ({
        id: f.querySelector('.art-id').value,
        cantidad: Number(f.querySelector('.art-cant').value),
      })),
      productos: [...contenedor.querySelectorAll('.prod-fila:not(.art-fila)')].map(f => ({
        clave: f.querySelector('.prod-clave').value,
        cantidad: Number(f.querySelector('.prod-cant').value),
        nota: f.querySelector('.prod-nota').value.trim() || null,
      })),
    };
  }

  // Agregar/quitar renglones y marcar el bloque como "a medio editar" para
  // que el polling no lo borre.
  function conectarAgenda(contenedor){
    contenedor.querySelectorAll('.agenda').forEach(caja => {
      caja.addEventListener('input', () => { caja.dataset.sucio = '1'; });
      caja.addEventListener('click', (e) => {
        if(e.target.closest('.art-agregar')){
          caja.querySelector('.art-lista').insertAdjacentHTML('beforeend', filaArticulo({ id: '', cantidad: 1 }));
          caja.dataset.sucio = '1';
        } else if(e.target.closest('.prod-agregar')){
          caja.querySelector('.prod-lista').insertAdjacentHTML('beforeend', filaProducto({ clave: '', cantidad: 1 }));
          caja.dataset.sucio = '1';
        } else if(e.target.closest('.prod-quitar')){
          e.target.closest('.prod-fila').remove();
          caja.dataset.sucio = '1';
        }
      });
    });
    contenedor.querySelectorAll('.agenda-guardar').forEach(b => b.addEventListener('click', () => guardarAgenda(b)));
  }

  async function guardarAgenda(btn){
    const caja = btn.closest('.agenda');
    const msg = caja.querySelector('.agenda-msg');
    btn.disabled = true;
    msg.textContent = 'Guardando…';
    try {
      await api('/api/dashboard-eventos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventoId: btn.dataset.id, accion: 'agenda', ...leerAgenda(caja) }),
      });
      delete caja.dataset.sucio;
      msg.textContent = 'Guardado.';
      setTimeout(loadDashboard, 800);
    } catch(e){
      if(e.message === 'sesion') return;
      msg.textContent = e.message || 'No se pudo guardar, intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  }

  function renderEventos(eventos){
    // El polling cada 30s no debe borrar instrucciones a medio escribir.
    if(mainContent.querySelector('.instr-texto:focus, .instr-texto[data-sucio], .msgcli-texto:focus, .msgcli-texto[data-sucio], .agenda :focus, .agenda[data-sucio]')) return;
    if(!eventos.length){
      mainContent.innerHTML = `<div class="empty-state">🗓️<br>Sin eventos activos por ahora.</div>`;
      return;
    }

    // Emergencias y alertas de seguridad primero
    const ordenados = [...eventos].sort((a,b) => {
      const prioridad = ev => ev.emergencia ? 0 : (ev.zonaAlertaSeguridad ? 1 : 2);
      return prioridad(a) - prioridad(b);
    });

    let html = renderResumen(eventos);

    ordenados.forEach(ev => {
      const claseFila = ev.emergencia ? 'emergencia' : (ev.zonaAlertaSeguridad ? 'seguridad' : '');
      const pagoClase = ev.estatusPago && ev.estatusPago.startsWith('Pendiente') ? 'badge-pago-pendiente' : 'badge-pago-pagado';
      const visual = estatusVisual(ev.estatusLogistico);
      const colorCss = `var(${visual.color})`;

      html += `
        <div class="evento-row ${claseFila}" style="border-left-color:${colorCss};">
          <div class="evento-top">
            <div>
              <h3>${esc(ev.ubicacion || 'Ubicación por confirmar')} · ${esc(ev.folio)}</h3>
              <div class="evento-sub">${formatFecha(ev.fecha)} · ${ev.negocio || ''} · Brigada: ${esc(ev.brigadaNombre)}${ev.brigadaLider ? ' (' + esc(ev.brigadaLider) + ')' : ''}</div>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end;">
              <span class="badge" style="background:color-mix(in srgb, ${colorCss} 22%, transparent); color:${colorCss};">${visual.icon} ${ev.estatusLogistico}</span>
              ${ev.estatusPago ? `<span class="badge ${pagoClase}">💰 ${ev.estatusPago}${ev.montoAdeudado ? ' · $' + ev.montoAdeudado : ''}</span>` : ''}
              ${ev.emergencia ? `<span class="badge badge-emergencia">🆘 Emergencia</span>` : ''}
              ${ev.zonaAlertaSeguridad ? `<span class="badge badge-seguridad">⚠️ Seguridad</span>` : ''}
              ${badgeSemaforo(ev.disponibilidad)}
              ${ev.fueraDeCiudad ? `<span class="badge badge-fuera">🛣️ Fuera de la ciudad</span>` : ''}
              ${ev.temporadaAlta ? `<span class="badge badge-fuera">🎄 Temporada alta</span>` : ''}
              ${ev.preferenciaContacto ? `<span class="badge badge-pref">📞 ${PREF_TEXTO[ev.preferenciaContacto] || esc(ev.preferenciaContacto)}</span>` : ''}
            </div>
          </div>
          <div class="meta-line">
            ${ev.horaInicio ? `<span>🕒 ${esc(ev.horaInicio)}</span>` : ''}
            ${ev.invitados ? `<span>👥 ${ev.invitados} invitados</span>` : ''}
            ${ev.etaConfirmado ? `<span>⏱️ ETA confirmado: ${esc(ev.etaConfirmado)}</span>` : ''}
            ${ev.autorizacionDiana ? `<span>✅ Autorización: ${ev.autorizacionDiana}</span>` : ''}
          </div>
          ${ev.retraso && ev.motivoRetraso ? `<div class="motivo">🚦 Retraso: ${esc(ev.motivoRetraso)}</div>` : ''}
          ${ev.emergencia && ev.motivoEmergencia ? `<div class="motivo">🆘 ${esc(ev.motivoEmergencia)}</div>` : ''}
          ${(ev.emergencia || ev.zonaAlertaSeguridad) && /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(ev.ubicacionAlerta || '')
            ? `<div class="motivo"><a href="https://maps.google.com/?q=${ev.ubicacionAlerta}" target="_blank" rel="noopener" style="color:var(--paper); font-weight:800;">📍 Ver ubicación en el mapa</a>${ev.ubicacionAlertaHora ? ' · actualizada ' + new Date(ev.ubicacionAlertaHora).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : ''}</div>`
            : ''}
          ${ev.zonaAlertaSeguridad ? `<div class="motivo">⚠️ Zona: ${esc(ev.zonaAlertaSeguridad)}</div>` : ''}
          ${ev.emergencia || ev.zonaAlertaSeguridad ? `
            <div class="instr-fila">
              ${ev.emergencia ? `<button class="resolver-btn" data-id="${esc(ev.id)}" data-tipo="emergencia">✅ Marcar emergencia resuelta</button>` : ''}
              ${ev.zonaAlertaSeguridad ? `<button class="resolver-btn" data-id="${esc(ev.id)}" data-tipo="alerta_seguridad">✅ Levantar alerta de seguridad</button>` : ''}
            </div>` : ''}
          ${ev.resumenCapacidad ? `<div class="motivo capacidad">${esc(ev.resumenCapacidad)}</div>` : ''}
          ${ev.disponibilidad && ev.disponibilidad.nivel !== 'verde' ? bloqueSemaforo(ev.disponibilidad) : ''}
          ${bloqueStaff(ev)}
          ${bloqueMensajeCliente(ev)}
          <details class="agenda">
            <summary>🗓️ Hora y productos${ev.horaInicio && ev.productos.length ? '' : ' (completar)'}</summary>
            ${camposAgenda(ev)}
            <div class="instr-fila">
              <button class="instr-guardar agenda-guardar" data-id="${esc(ev.id)}">Guardar</button>
              <span class="instr-msg agenda-msg"></span>
            </div>
          </details>
          <details class="instr" ${ev.instrucciones ? 'open' : ''}>
            <summary>📌 Instrucciones para el equipo${ev.instrucciones ? '' : ' (agregar)'}</summary>
            <textarea class="instr-texto" data-id="${esc(ev.id)}" maxlength="2000" placeholder="Ej. Llegar a las 4 pm, entrar por la puerta de atrás, preguntar por Sra. López">${esc(ev.instrucciones)}</textarea>
            <div class="instr-fila">
              <button class="instr-guardar" data-id="${esc(ev.id)}">Guardar y avisar al equipo</button>
              <span class="instr-msg"></span>
            </div>
          </details>
        </div>
      `;
    });

    mainContent.innerHTML = html;

    mainContent.querySelectorAll('.instr-texto').forEach(t => {
      t.addEventListener('input', () => { t.dataset.sucio = '1'; });
    });
    mainContent.querySelectorAll('.instr-guardar').forEach(b => {
      b.addEventListener('click', () => guardarInstrucciones(b));
    });
    conectarMensajeCliente(mainContent);
    conectarAgenda(mainContent);
    mainContent.querySelectorAll('.resolver-btn').forEach(b => {
      b.addEventListener('click', () => resolverAlerta(b));
    });
  }

  async function resolverAlerta(btn){
    const tipo = btn.dataset.tipo;
    if(!confirm(tipo === 'emergencia' ? '¿Marcar la emergencia como resuelta? Se avisa al equipo por Telegram.' : '¿Levantar la alerta de seguridad? Se avisa al equipo por Telegram.')) return;
    btn.disabled = true;
    try {
      await api('/api/brigada-estatus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventoId: btn.dataset.id, tipo, valor: false }),
      });
      loadDashboard();
    } catch(e){
      if(e.message === 'sesion') return;
      btn.disabled = false;
      alert(e.message || 'No se pudo marcar como resuelta, intenta de nuevo.');
    }
  }

  async function guardarInstrucciones(btn){
    const caja = btn.closest('.instr');
    const texto = caja.querySelector('.instr-texto');
    const msg = caja.querySelector('.instr-msg');
    btn.disabled = true;
    msg.textContent = 'Guardando…';
    try {
      const data = await api('/api/dashboard-eventos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventoId: btn.dataset.id, accion: 'instrucciones', instrucciones: texto.value }),
      });
      delete texto.dataset.sucio;
      msg.textContent = data.avisados ? `Guardado. Aviso enviado a ${data.avisados} del equipo.`
        : texto.value.trim() ? 'Guardado. Aún no hay equipo asignado a este evento para avisar.' : 'Guardado.';
    } catch(e){
      if(e.message === 'sesion') return;
      msg.textContent = e.message || 'No se pudo guardar, intenta de nuevo.';
    } finally {
      btn.disabled = false;
    }
  }

  function telLink(tel){
    const digitos = String(tel || '').replace(/\D/g, '');
    return digitos ? `<a href="tel:+${digitos}">${esc(tel.replace('whatsapp:', ''))}</a>` : '';
  }

  function renderPedidos(pedidos){
    // El polling cada 30s no debe borrar lo que Diana está escribiendo:
    // solo se vuelve a pintar si cambió la lista de pedidos.
    const firma = pedidos.map(p => `${p.id}:${p.mensajeEntregado}:${(p.mensajeParaCliente || '').length}:${p.disponibilidad ? p.disponibilidad.nivel + p.disponibilidad.motivos.length : ''}`).join(',');
    if(firma === pedidosFirma) return;
    if(pedidosContent.querySelector('input:focus, textarea:focus, select:focus, .msgcli-texto[data-sucio], .agenda[data-sucio]')) return;
    pedidosFirma = firma;

    if(!pedidos.length){ pedidosContent.innerHTML = ''; return; }

    const cuenta = (nivel) => pedidos.filter(p => p.disponibilidad && p.disponibilidad.nivel === nivel).length;
    const conteo = ['verde', 'amarillo', 'rojo'].filter(n => cuenta(n)).map(n => `${SEMAFORO[n].icono} ${cuenta(n)}`).join(' · ');
    pedidosContent.innerHTML = `<h2 class="section-title">🎉 Pedidos por cotizar (${pedidos.length})${conteo ? ' · ' + conteo : ''}</h2>` +
      pedidos.map(p => `
        <div class="pedido-card" data-id="${esc(p.id)}">
          <div class="evento-top">
            <div>
              <h3>${esc(p.clienteNombre || 'Cliente')} · ${esc(p.folio)}</h3>
              <div class="evento-sub">${formatFecha(p.fecha)}${p.horaInicio ? ' · 🕒 ' + esc(p.horaInicio) : ''} · ${esc(p.negocio || 'Negocio sin especificar')}${p.invitados ? ' · 👥 ' + esc(p.invitados) : ''}</div>
            </div>
          </div>
          ${bloqueSemaforo(p.disponibilidad)}
          ${bloqueLimite(p.limiteRespuesta)}
          <div class="meta-line pedido-contacto">
            ${p.clienteTelefono ? `<span>📞 ${telLink(p.clienteTelefono)}</span>` : ''}
            ${p.clienteEmail ? `<span>✉️ <a href="mailto:${esc(p.clienteEmail)}">${esc(p.clienteEmail)}</a></span>` : ''}
            ${p.ubicacion ? `<span>📍 ${esc(p.ubicacion)}</span>` : ''}
          </div>
          ${p.fueraDeCiudad ? `<div class="motivo aviso-fuera">🛣️ Fuera de la ciudad: confirma cobertura y suma el costo de traslado al monto.</div>` : ''}
          ${p.temporadaAlta ? `<div class="motivo aviso-fuera">🎄 Temporada alta: sin paquetes regulares; precios de temporada (+70%).</div>` : ''}
          ${p.preferenciaContacto ? `<div class="motivo">📞 ${PREF_TEXTO[p.preferenciaContacto] || esc(p.preferenciaContacto)}</div>` : ''}
          ${bloqueMensajeCliente(p)}
          ${p.notas ? `<div class="motivo">${esc(p.notas)}</div>` : ''}
          <div class="servicios">${esc(p.servicios)}</div>
          ${p.resumenCapacidad ? `<div class="motivo capacidad">${esc(p.resumenCapacidad)}</div>` : ''}
          <div class="agenda">${camposAgenda(p)}</div>
          <label for="monto-${esc(p.id)}">Monto total (MXN)</label>
          <input type="number" id="monto-${esc(p.id)}" class="pedido-monto" min="1" step="1" inputmode="numeric" placeholder="Ej. 4500" value="${p.montoEstimado ? esc(p.montoEstimado) : ''}">
          ${p.montoEstimado ? '<div class="evento-sub">Estimado de DiMa, ajústalo si hace falta.</div>' : ''}
          <label for="items-${esc(p.id)}">Checklist de carga (un artículo por línea)</label>
          <textarea id="items-${esc(p.id)}" class="pedido-items">${esc(p.servicios)}</textarea>
          <label for="instr-${esc(p.id)}">Instrucciones para el equipo (opcional)</label>
          <textarea id="instr-${esc(p.id)}" class="pedido-instr" maxlength="2000" placeholder="Horario de montaje, acceso, a quién buscar…">${esc(p.instrucciones)}</textarea>
          <div class="pedido-actions">
            <button class="btn-autorizar" data-accion="autorizar">✅ Autorizar</button>
            <button class="btn-rechazar" data-accion="rechazar">Rechazar</button>
          </div>
          <div class="pedido-msg"></div>
        </div>
      `).join('');

    conectarMensajeCliente(pedidosContent);
    conectarAgenda(pedidosContent);
    pedidosContent.querySelectorAll('.pedido-actions button').forEach(btn => {
      btn.addEventListener('click', () => resolverPedido(btn));
    });
  }

  async function resolverPedido(btn){
    const card = btn.closest('.pedido-card');
    const msg = card.querySelector('.pedido-msg');
    const accion = btn.dataset.accion;
    const monto = card.querySelector('.pedido-monto').value;
    const items = card.querySelector('.pedido-items').value;
    const instrucciones = card.querySelector('.pedido-instr').value;

    if(accion === 'autorizar' && !(Number(monto) > 0)){
      msg.style.color = 'var(--bad)';
      msg.textContent = 'Escribe el monto antes de autorizar.';
      return;
    }

    card.querySelectorAll('button').forEach(b => b.disabled = true);
    msg.style.color = 'var(--muted)';
    msg.textContent = accion === 'autorizar' ? 'Autorizando…' : 'Rechazando…';
    try {
      const data = await api('/api/dashboard-eventos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ eventoId: card.dataset.id, accion, monto, items, instrucciones, ...(accion === 'autorizar' ? leerAgenda(card.querySelector('.agenda')) : {}) }),
      });
      msg.style.color = 'var(--good)';
      msg.textContent = accion === 'rechazar' ? 'Pedido rechazado.'
        : data.googleOk ? 'Autorizado. Checklist listo para la brigada.'
        : 'Autorizado, pero falló Calendar, Sheets o el correo al cliente. Revísalo a mano.';
      pedidosFirma = null;
      setTimeout(loadDashboard, 1500);
    } catch(e){
      msg.style.color = 'var(--bad)';
      msg.textContent = e.message || 'No se pudo guardar, intenta de nuevo.';
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  function renderBalance(balance){
    if(!balance){ balanceContent.innerHTML = ''; return; }
    const abierto = balanceContent.querySelector('details')?.open ? 'open' : '';
    const fmt = n => '$' + Number(n || 0).toLocaleString('es-MX');
    balanceContent.innerHTML = `
      <details class="balance-card" ${abierto}>
        <summary>📊 Último balance · ${esc(balance.periodo)} · Utilidad ${fmt(balance.ingresos - balance.gastos)}</summary>
        <pre>${esc(balance.detalle)}</pre>
      </details>
    `;
  }

  async function loadDashboard(){
    try {
      const data = await api('/api/dashboard-eventos');
      catalogo = data.catalogo || [];
      inventario = data.inventario || [];
      // Suena y vibra si apareció una emergencia o alerta de seguridad nueva.
      DimaAlertas.revisar((data.eventos || []).flatMap(ev => [
        ev.emergencia ? `${ev.id}|E|${ev.motivoEmergencia}` : null,
        ev.zonaAlertaSeguridad ? `${ev.id}|S|${ev.zonaAlertaSeguridad}` : null,
      ].filter(Boolean)));
      renderPedidos(data.pedidos || []);
      renderBalance(data.balance);
      renderEventos(data.eventos);
    } catch(e){
      if(e.message === 'sesion') return;
      mainContent.innerHTML = `<div class="empty-state">📡<br>No se pudo cargar. Revisa tu señal y toca actualizar.</div>`;
    }
  }

  refreshBtn.addEventListener('click', loadDashboard);
  $('logoutBtn').addEventListener('click', salir);

  if(sesion && sesion.rol === 'Admin'){
    DimaAlertas.iniciar({ contenedorBoton: $('alertasBanner'), token: () => sesion.token });
    loadDashboard();
    // Actualiza cada 30s mientras la pantalla está abierta.
    pollTimer = setInterval(loadDashboard, 30000);
  }
</script>
</body>
</html>
